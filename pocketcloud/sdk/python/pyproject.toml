[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pocketcloud"
version = "0.0.1"
description = "Pocket Cloud customer SDK (managed mode): submit private, MAC-verified distributed jobs in ~5 lines."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "UNLICENSED" }
authors = [{ name = "Pocket Cloud" }]
keywords = ["mpc", "secret-sharing", "privacy", "distributed-compute"]
# Runtime is standard-library only (urllib, json, dataclasses) by design:
# no third-party dependency in the demand-side critical path (Standards §5).
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://pocket.cloud"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
